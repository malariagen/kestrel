[package]
name = "kestrel"
version = "0.1.1"
edition = "2024"
description = "Fast relatedness estimation from genomic data"
repository = "https://github.com/malariagen/kestrel"
license = "MPL-2.0"
keywords = ["bioinformatics", "genetics"]
categories = ["mathematics", "science"]
readme = "README.md"

[lib]
# Import name
name = "kestrel"
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "kestrel"

[dependencies]
anyhow = "1.0.103"
csv = "1.4.0"
clap = { version = "4.6", features = ["derive"] }
# TODO remove?
itertools = "0.15.0"
lockfree_progress_bar = "0.1.0"
ndarray = "0.17.2"
noodles = { version = "0.111.0", features = ["vcf"] }
numpy = "0.29.0"
paralight = "0.0.12"
num_cpus = "1.17.0"
log = "0.4.34"
env_logger = "0.11.11"

[dependencies.pyo3]
version = "0.29"
# This is earliest supported version
features = ["abi3-py39"]

[profile.release]
# vcf parsing is faster with abort,
# and we don't have any resources for destructors to clean up
# that exiting the process wouldn't cleanup anyway
panic = "abort"
codegen-units = 1
#overflow-checks = true
lto = true

# inherits from release profile
[profile.bench]
# echo -1 | sudo tee /proc/sys/kernel/perf_event_paranoid
debug = true

[dev-dependencies]
divan = "0.1.21"
nalgebra = {version = "0.35.0", features = ["rand"] }
rand = "0.10.2"

[[bench]]
name = "bench"
harness = false
